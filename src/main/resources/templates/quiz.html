<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz do Universo</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>
    <main class="painel">
        <h1>🌌 Missão cósmica</h1>
        <p th:text="'Explorador: '+${apelido}"></p>
        <form action="/finalizar" method="post">
            <section class="pergunta" th:each="p,st : ${perguntas}">
                <h2 th:text="${st.count}+'. '+${p.enunciado}"></h2><label th:each="op : ${ {'A','B','C','D'} }"
                    class="alternativa"><input type="radio" th:name="'q'+${p.id}" th:value="${op}" required><span
                        th:text="${op}+'. '+${op == 'A' ? p.a : (op == 'B' ? p.b : (op == 'C' ? p.c : p.d))}"></span></label>
            </section><button>✨ Finalizar missão</button>
        </form>
    </main>
</body>

</html>
